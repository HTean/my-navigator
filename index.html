<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Navigator</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f6f3;--surface:#fff;--border:#e8e6e1;--border-strong:#d0cdc6;
  --text:#1c1b18;--text-muted:#8a8780;--text-light:#b5b2ac;
  --accent:#2563eb;--accent-bg:#eff6ff;--accent-muted:#bfdbfe;
  --danger:#dc2626;--warn-bg:#fffbeb;--warn-border:#fcd34d;--warn-text:#92400e;
  --sidebar-w:240px;--topbar-h:60px;
  --radius:12px;--radius-sm:8px;
  --shadow:0 1px 3px rgba(0,0,0,.06);--shadow-md:0 4px 16px rgba(0,0,0,.08);
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;font-size:15px}
#topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 20px;z-index:100}
.logo{font-weight:600;font-size:17px;color:var(--text);white-space:nowrap;display:flex;align-items:center;gap:8px;margin-right:4px}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
#search-wrap{flex:1;max-width:500px;position:relative}
#search-input{width:100%;padding:9px 14px 9px 38px;border:1px solid var(--border);border-radius:20px;font-size:14px;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);outline:none;transition:all .2s}
#search-input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-bg)}
#search-input::placeholder{color:var(--text-light)}
.search-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-light);font-size:15px;pointer-events:none}
.topbar-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--bg);border-color:var(--border-strong)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:#1d4ed8;border-color:#1d4ed8}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--bg);border-color:var(--border)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
#layout{display:flex;margin-top:var(--topbar-h);min-height:calc(100vh - var(--topbar-h))}
#sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:20px 0;position:fixed;top:var(--topbar-h);bottom:0;overflow-y:auto}
.sidebar-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-light);padding:0 18px;margin:16px 0 6px}
.folder-item{display:flex;align-items:center;gap:10px;padding:9px 18px;cursor:pointer;font-size:14px;transition:background .12s;position:relative;color:var(--text-muted);user-select:none}
.folder-item:hover{background:var(--bg);color:var(--text)}
.folder-item.active{background:var(--accent-bg);color:var(--accent);font-weight:500}
.folder-item.dragging{opacity:.4}
.folder-item.drag-over{border-top:2px solid var(--accent)}
.fi-icon{font-size:16px;flex-shrink:0}.fi-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi-count{font-size:11px;font-family:'DM Mono',monospace;background:var(--bg);color:var(--text-light);padding:1px 7px;border-radius:10px;border:1px solid var(--border)}
.folder-item.active .fi-count{background:var(--accent-muted);color:var(--accent);border-color:var(--accent-muted)}
.folder-actions{display:none;gap:2px}.folder-item:hover .folder-actions{display:flex}
.drag-handle{cursor:grab;color:var(--text-light);font-size:14px;padding:0 2px;display:none}
.folder-item:hover .drag-handle{display:block}
.ico-btn{width:22px;height:22px;border-radius:5px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-muted);transition:background .12s}
.ico-btn:hover{background:var(--border);color:var(--text)}
#add-folder-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 18px;font-size:14px;color:var(--text-light);border:none;background:transparent;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .12s}
#add-folder-btn:hover{background:var(--bg);color:var(--text-muted)}
#main{margin-left:var(--sidebar-w);flex:1;padding:28px 28px 40px}
.page-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.page-title{font-size:20px;font-weight:600;color:var(--text)}
.public-badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500;background:#dcfce7;color:#15803d;border:1px solid #bbf7d0}
.viewing-badge{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-muted)}
#guest-banner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:20px;font-size:13px;color:var(--warn-text)}
#guest-banner strong{font-weight:600}
.banner-actions{display:flex;gap:8px;flex-shrink:0}
#sites-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px}
.site-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 14px 14px;display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer;transition:all .18s;position:relative;user-select:none}
.site-card:hover{box-shadow:var(--shadow-md);border-color:var(--border-strong);transform:translateY(-2px)}
.site-card.dragging{opacity:.35;transform:scale(.96)}
.site-card.drop-before{box-shadow:-3px 0 0 0 var(--accent)}
.site-card.drop-after{box-shadow:3px 0 0 0 var(--accent)}
.site-logo{width:52px;height:52px;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--accent-bg);color:var(--accent);font-size:22px;font-weight:700;flex-shrink:0;border:1px solid var(--border)}
.site-logo img{width:100%;height:100%;object-fit:contain;display:block}
.site-name{font-size:13px;font-weight:500;text-align:center;word-break:break-word;line-height:1.35;color:var(--text)}
.site-desc{font-size:11px;color:var(--text-muted);text-align:center;line-height:1.4;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.site-host{font-size:10px;font-family:'DM Mono',monospace;color:var(--text-light);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.card-menu{position:absolute;top:8px;right:8px;opacity:0;background:var(--surface);border:1px solid var(--border);border-radius:6px;width:24px;height:24px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);transition:opacity .15s;box-shadow:var(--shadow)}
.site-card:hover .card-menu{opacity:1}
.drag-hint{font-size:10px;color:var(--text-light);position:absolute;top:6px;left:8px;opacity:0;transition:opacity .15s}
.site-card:hover .drag-hint{opacity:1}
.add-card{background:transparent;border:2px dashed var(--border);border-radius:var(--radius);padding:18px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;min-height:130px;color:var(--text-light);font-size:13px;font-weight:500;transition:all .18s}
.add-card:hover{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.plus-ring{width:38px;height:38px;border-radius:50%;border:2px dashed currentColor;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;transition:transform .18s}
.add-card:hover .plus-ring{transform:scale(1.1)}
.empty-state{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;padding:60px 24px;color:var(--text-light);text-align:center;gap:10px}
.empty-icon{font-size:44px;opacity:.5}
.empty-state p{font-size:15px;color:var(--text-muted)}
.search-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-bg);border:1px solid var(--accent-muted);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:18px;font-size:13px;color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(2px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:460px;box-shadow:0 24px 64px rgba(0,0,0,.16);animation:popIn .2s cubic-bezier(.34,1.56,.64,1);border:1px solid var(--border)}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:22px 22px 0}
.modal-head h3{font-size:17px;font-weight:600}
.modal-body{padding:18px 22px}
.modal-foot{padding:0 22px 22px;display:flex;gap:8px;justify-content:flex-end}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:500;color:var(--text-muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.field input,.field textarea,.field select{width:100%;padding:10px 13px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);outline:none;transition:all .2s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-bg)}
.field textarea{resize:vertical;min-height:72px}
.field .hint{font-size:11px;color:var(--text-light);margin-top:4px}
.required{color:var(--danger)}
.url-row{display:flex;align-items:flex-end;gap:10px;margin-bottom:16px}
.url-row .field{flex:1;margin-bottom:0}
#fav-preview{width:44px;height:44px;border-radius:10px;border:1px solid var(--border);background:var(--accent-bg);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden}
#fav-preview img{width:100%;height:100%;object-fit:contain}
.social-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px 16px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:'DM Sans',sans-serif;transition:all .15s;margin-bottom:10px}
.social-btn:hover{background:var(--bg)}
.social-btn.github{background:#24292e;color:#fff;border-color:#24292e}
.social-btn.github:hover{background:#1a1f23}
.social-btn.google{background:#fff;border-color:#e0e0e0}
.social-btn.google:hover{background:#f8f8f8}
.divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--text-light);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.auth-toggle{text-align:center;font-size:13px;color:var(--text-muted);margin-top:16px}
.auth-toggle a{color:var(--accent);cursor:pointer}
.auth-error{background:#fef2f2;border:1px solid #fecaca;border-radius:var(--radius-sm);padding:10px 13px;font-size:13px;color:var(--danger);margin-bottom:14px;display:none}
.unsaved-warn{background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;color:var(--warn-text);margin-bottom:16px;display:flex;align-items:flex-start;gap:10px}
.ctx{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);z-index:300;min-width:168px;overflow:visible;animation:ctxPop .12s ease}
@keyframes ctxPop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.ctx-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;font-size:13px;cursor:pointer;transition:background .1s;position:relative}
.ctx-item:hover{background:var(--bg)}
.ctx-item.danger{color:var(--danger)}
.ctx-sep{height:1px;background:var(--border);margin:4px 0}
.ctx-item .ctx-arrow{color:var(--text-light);font-size:11px}
.ctx-sub{position:absolute;left:100%;top:-4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);min-width:160px;display:none;z-index:301;overflow:hidden}
.ctx-item:hover .ctx-sub{display:block}
.ctx-sub .ctx-sub-item{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:13px;cursor:pointer;transition:background .1s}
.ctx-sub .ctx-sub-item:hover{background:var(--bg)}
.user-menu{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);z-index:300;min-width:200px;overflow:hidden;animation:ctxPop .12s ease}
.user-info{padding:14px;border-bottom:1px solid var(--border)}
.u-name{font-weight:500;font-size:14px}.u-email{font-size:12px;color:var(--text-muted);margin-top:2px}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:400}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1c1b18;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:999;transition:transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
.share-url{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 13px;font-size:12px;font-family:'DM Mono',monospace;word-break:break-all;color:var(--text-muted);margin-top:10px}
.g-ico{width:18px;height:18px;flex-shrink:0}
.gh-ico{width:18px;height:18px;fill:currentColor;flex-shrink:0}
#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90}
#menu-btn{display:none;background:none;border:none;cursor:pointer;font-size:22px;padding:4px;color:var(--text);flex-shrink:0}
@media(max-width:768px){
  #menu-btn{display:flex;align-items:center}
  #sidebar{transform:translateX(-100%);transition:transform .25s ease;z-index:95}
  #sidebar.open{transform:translateX(0)}
  #sidebar-overlay.open{display:block}
  #main{margin-left:0!important;padding:16px}
  #search-wrap{max-width:none}
  #sites-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
  .site-card{padding:14px 10px 10px}
  .site-logo{width:42px;height:42px}
  .site-name{font-size:12px}
  #topbar{padding:0 12px;gap:8px}
  .logo{font-size:15px}
  #guest-banner{flex-direction:column;align-items:flex-start}
  .topbar-right .btn-ghost{display:none}
  .overlay{align-items:flex-end;padding:0}
  .modal{max-width:100%;border-radius:16px 16px 0 0;margin:0;position:relative;max-height:92vh;overflow-y:auto}
  .card-menu{opacity:1}
  .drag-hint{display:none}
}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div></div>
<div id="sidebar-overlay" id="sidebar-overlay"></div>
<div id="topbar">
  <button id="menu-btn">☰</button>
  <div class="logo"><div class="logo-dot"></div>Navigator</div>
  <div id="search-wrap"><span class="search-ico">🔍</span><input type="text" id="search-input" placeholder="Search…" autocomplete="off"/></div>
  <div class="topbar-right">
    <button class="btn btn-sm btn-ghost" id="share-btn" style="display:none">🔗 Share</button>
    <button class="btn btn-sm btn-primary" id="add-site-btn" style="display:none">+ Add</button>
    <div id="auth-area"></div>
  </div>
</div>
<div id="layout">
  <div id="sidebar">
    <div class="sidebar-label">Categories</div>
    <div id="folder-list"></div>
    <button id="add-folder-btn" style="display:none">＋ &nbsp;New Category</button>
  </div>
  <div id="main">
    <div class="page-header">
      <div class="page-title" id="page-title">All Sites</div>
      <span id="public-badge" style="display:none" class="public-badge">Public</span>
      <span id="viewing-badge" style="display:none" class="viewing-badge">👀 Viewing shared page</span>
      <button id="back-to-mine-btn" style="display:none" class="btn btn-sm btn-primary">← My Navigator</button>
    </div>
    <div id="guest-banner" style="display:none">
      <div><strong>👋 You're browsing as a guest.</strong> Any changes won't be saved. Sign in to keep your data across all devices.</div>
      <div class="banner-actions">
        <button class="btn btn-sm" id="banner-signin-btn">Sign in</button>
        <button class="btn btn-sm btn-primary" id="banner-signup-btn">Create account</button>
      </div>
    </div>
    <div id="search-banner" style="display:none"></div>
    <div id="sites-grid"></div>
  </div>
</div>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://vhljeqeqedtrqspevidm.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZobGplcWVxZWR0cnFzcGV2aWRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNzk3NDEsImV4cCI6MjA5NDk1NTc0MX0.TcUhUJFSsYMrbIYh7yh9Zb1bkVzCa5Eys7Koddo3G9o';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let user=null;
let folders=[],sites=[],isPublic=false,activeFolder='all',searchQuery='';
let viewingUserId=null;
let isReadOnly=false;
let sharedFolderOnly=false; // true when URL has folder= param — block viewing all sites

// ── INIT ──────────────────────────────────────────────────────────────────
async function init(){
  // Handle OAuth redirect
  if(window.location.hash&&window.location.hash.includes('access_token')){
    await sb.auth.getSession();
    history.replaceState(null,'',window.location.pathname);
  }

  // Check if viewing a shared page (?user=UUID)
  const params=new URLSearchParams(window.location.search);
  const sharedUserId=params.get('user');
  const sharedFolderId=params.get('folder');

  const{data:{session}}=await sb.auth.getSession();
  if(session){user=session.user;}

  if(sharedUserId && sharedUserId!==user?.id){
    viewingUserId=sharedUserId;
    isReadOnly=true;
    sharedFolderOnly=!!sharedFolderId;
    await loadSharedData(sharedUserId,sharedFolderId);
  } else {
    viewingUserId=null;
    isReadOnly=false;
    if(user) await loadData();
  }

  showApp();

  sb.auth.onAuthStateChange(async(event,session)=>{
    if((event==='SIGNED_IN'||event==='TOKEN_REFRESHED')&&session&&(!user||user.id!==session.user.id)){
      const gFolders=[...folders],gSites=[...sites];
      user=session.user;
      // If was viewing shared page, keep viewing it but now logged in
      if(!isReadOnly){
        await loadData();
        closeModal();
        showApp();
        if(gSites.length>0&&confirm(`Import ${gSites.length} guest site(s) into your account?`)){
          for(const f of gFolders){
            const{data:nf}=await sb.from('folders').insert({user_id:user.id,name:f.name,order_index:f.order_index||0}).select().single();
            if(nf)gSites.forEach(s=>{if(s.folder_id===f.id)s.folder_id=nf.id;});
          }
          for(const s of gSites){
            await sb.from('sites').insert({user_id:user.id,url:s.url,name:s.name,description:s.description,folder_id:s.folder_id||null,order_index:s.order_index||0});
          }
          await loadData();render();
        }
      } else {
        closeModal();renderAuthArea();
      }
    } else if(event==='SIGNED_OUT'){
      user=null;
      if(!isReadOnly){folders=[];sites=[];isPublic=false;}
      showApp();
    }
  });
}

function showApp(){
  document.getElementById('loading').style.display='none';
  renderAuthArea();
  document.getElementById('add-site-btn').style.display=isReadOnly?'none':'inline-flex';
  document.getElementById('add-folder-btn').style.display=isReadOnly?'none':'block';
  document.getElementById('share-btn').style.display=(user&&!isReadOnly)?'inline-flex':'none';
  document.getElementById('viewing-badge').style.display=isReadOnly?'inline-flex':'none';
  const backBtn=document.getElementById('back-to-mine-btn');
  if(isReadOnly&&user){
    backBtn.style.display='inline-flex';
    backBtn.onclick=()=>{window.location.href=window.location.pathname;};
  } else {
    backBtn.style.display='none';
  }
  render();
}

// ── AUTH AREA ─────────────────────────────────────────────────────────────
function renderAuthArea(){
  const area=document.getElementById('auth-area');
  if(user){
    const meta=user.user_metadata||{};

// ── LOAD DATA ─────────────────────────────────────────────────────────────
async function loadData(){
  if(!user)return;
  const[{data:f},{data:s},{data:p}]=await Promise.all([
    sb.from('folders').select('*').eq('user_id',user.id).order('order_index').order('created_at'),
    sb.from('sites').select('*').eq('user_id',user.id).order('order_index').order('created_at'),
    sb.from('profiles').select('*').eq('id',user.id).single(),
  ]);
  folders=f||[];sites=s||[];isPublic=p?.is_public||false;
  if(!p){await sb.from('profiles').upsert({id:user.id,is_public:false},{onConflict:'id'});}
}

async function loadSharedData(userId,folderId=null){
  const{data:profile}=await sb.from('profiles').select('*').eq('id',userId).eq('is_public',true).single();
  if(!profile){
    folders=[];sites=[];
    document.getElementById('sites-grid').innerHTML=`
      <div class="empty-state">
        <div class="empty-icon">🔒</div>
        <p>This page is private or does not exist.</p>
        <small>The owner may have made it private or the link is incorrect.</small>
      </div>`;
    return;
  }

  // If folderId was in the original URL, ONLY load that folder
  // If someone removed folder= from URL, block them — treat as invalid
  if(sharedFolderOnly && !folderId){
    folders=[];sites=[];
    document.getElementById('sites-grid').innerHTML=`
      <div class="empty-state">
        <div class="empty-icon">🔒</div>
        <p>This link is for a specific category only.</p>
        <small>You don't have permission to view the full navigator.</small>
      </div>`;
    return;
  }

  let fQuery=sb.from('folders').select('*').eq('user_id',userId).order('order_index').order('created_at');
  let sQuery=sb.from('sites').select('*').eq('user_id',userId).order('order_index').order('created_at');
  if(folderId){
    fQuery=fQuery.eq('id',folderId);
    sQuery=sQuery.eq('folder_id',folderId);
  }
  const[{data:f},{data:s}]=await Promise.all([fQuery,sQuery]);
  folders=f||[];sites=s||[];
  if(folderId&&folders.length>0)activeFolder=folders[0].id;
}

// ── ENSURE SESSION ────────────────────────────────────────────────────────
async function ensureSession(){
  if(!user){
    const{data:{session}}=await sb.auth.getSession();
    if(session){user=session.user;await loadData();showApp();}
  }
  return!!user;
}

// ── DATA MUTATIONS ────────────────────────────────────────────────────────
async function saveFolder(name){
  if(isReadOnly)return;
  if(!(await ensureSession())){guestAddFolder(name);return;}
  const order_index=folders.length;
  const{data,error}=await sb.from('folders').insert({user_id:user.id,name,order_index}).select().single();
  if(error){toast('Error: '+error.message);return;}
  folders.push(data);render();toast('Category created');
}
async function updateFolder(id,name){
  if(isReadOnly)return;
  if(!(await ensureSession())){folders.find(f=>f.id===id).name=name;render();return;}
  await sb.from('folders').update({name}).eq('id',id).eq('user_id',user.id);
  folders.find(f=>f.id===id).name=name;render();toast('Category renamed');
}
async function deleteFolder(id){
  if(isReadOnly)return;
  if(!(await ensureSession())){
    folders=folders.filter(f=>f.id!==id);sites.forEach(s=>{if(s.folder_id===id)s.folder_id=null;});
    if(activeFolder===id)activeFolder='all';render();return;
  }
  await sb.from('folders').delete().eq('id',id).eq('user_id',user.id);
  folders=folders.filter(f=>f.id!==id);sites.forEach(s=>{if(s.folder_id===id)s.folder_id=null;});
  if(activeFolder===id)activeFolder='all';render();toast('Category deleted');
}
async function saveSite(data){
  if(isReadOnly)return;
  if(!(await ensureSession())){guestAddSite(data);return;}
  const order_index=sites.filter(s=>s.folder_id===data.folder_id).length;
  const{data:row,error}=await sb.from('sites').insert({user_id:user.id,...data,order_index}).select().single();
  if(error){toast('Error: '+error.message);console.error(error);return;}
  sites.push(row);render();toast('Site added');
}
async function updateSite(id,data){
  if(isReadOnly)return;
  if(!(await ensureSession())){Object.assign(sites.find(s=>s.id===id),data);render();return;}
  await sb.from('sites').update(data).eq('id',id).eq('user_id',user.id);
  Object.assign(sites.find(s=>s.id===id),data);render();toast('Site updated');
}
async function deleteSite(id){
  if(isReadOnly)return;
  if(!(await ensureSession())){sites=sites.filter(s=>s.id!==id);render();return;}
  await sb.from('sites').delete().eq('id',id).eq('user_id',user.id);
  sites=sites.filter(s=>s.id!==id);render();toast('Site removed');
}
async function togglePublic(){
  if(!user||isReadOnly)return;
  isPublic=!isPublic;
  await sb.from('profiles').upsert({id:user.id,is_public:isPublic});
  render();toast(isPublic?'Page is now public':'Page is now private');
}

    </div>`;
  });

  // folder click
  list.querySelectorAll('.folder-item').forEach(el=>{
    el.addEventListener('click',e=>{
      if(e.target.closest('[data-rename],[data-del-folder],.drag-handle'))return;
      activeFolder=el.dataset.folder;searchQuery='';document.getElementById('search-input').value='';closeSidebarMobile();render();
    });

  if(!isReadOnly){

    list.querySelectorAll('[data-del-folder]').forEach(btn=>btn.addEventListener('click',e=>{
      e.stopPropagation();if(confirm('Delete this category?'))deleteFolder(btn.dataset.delFolder);

function setupFolderDrag(list){
  let dragSrc=null;
  list.querySelectorAll('.folder-item[draggable=true]').forEach(el=>{
    el.addEventListener('dragstart',e=>{
      dragSrc=el;el.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
    });
    el.addEventListener('dragend',()=>{
      el.classList.remove('dragging');
      list.querySelectorAll('.folder-item').forEach(x=>x.classList.remove('drag-over'));
    });
    el.addEventListener('dragover',e=>{
      e.preventDefault();e.dataTransfer.dropEffect='move';
      list.querySelectorAll('.folder-item').forEach(x=>x.classList.remove('drag-over'));
      if(el!==dragSrc)el.classList.add('drag-over');
    });
    el.addEventListener('drop',e=>{
      e.preventDefault();
      if(!dragSrc||dragSrc===el)return;
      el.classList.remove('drag-over');
      const srcId=dragSrc.dataset.folder;
      const tgtId=el.dataset.folder;
      const srcIdx=folders.findIndex(f=>f.id===srcId);
      const tgtIdx=folders.findIndex(f=>f.id===tgtId);
      if(srcIdx<0||tgtIdx<0)return;
      const[moved]=folders.splice(srcIdx,1);
      folders.splice(tgtIdx,0,moved);
      render();
      saveFolderOrder();
      toast('Category order saved');
    });
  });
}

function setupSiteDrag(grid,visibleList){
  let dragSrc=null;
  function clearIndicators(){grid.querySelectorAll('.site-card').forEach(x=>{x.classList.remove('drop-before','drop-after');});}

  grid.querySelectorAll('.site-card[draggable=true]').forEach(el=>{
    el.addEventListener('dragstart',e=>{
      dragSrc=el;
      setTimeout(()=>el.classList.add('dragging'),0);
      e.dataTransfer.effectAllowed='move';
    });
    el.addEventListener('dragend',()=>{
      el.classList.remove('dragging');
      clearIndicators();
      dragSrc=null;
    });
    el.addEventListener('dragover',e=>{
      e.preventDefault();e.dataTransfer.dropEffect='move';
      if(!dragSrc||el===dragSrc)return;
      clearIndicators();
      // Determine if cursor is on left or right half of the card
      const rect=el.getBoundingClientRect();
      const midX=rect.left+rect.width/2;
      if(e.clientX<midX) el.classList.add('drop-before');
      else el.classList.add('drop-after');
    });
    el.addEventListener('dragleave',()=>clearIndicators());
    el.addEventListener('drop',e=>{
      e.preventDefault();
      if(!dragSrc||dragSrc===el)return;
      const insertBefore=el.classList.contains('drop-before');
      clearIndicators();
      const srcId=dragSrc.dataset.id;
      const tgtId=el.dataset.id;
      const srcIdx=sites.findIndex(s=>s.id===srcId);
      let tgtIdx=sites.findIndex(s=>s.id===tgtId);
      if(srcIdx<0||tgtIdx<0)return;
      const[moved]=sites.splice(srcIdx,1);
      // Recalculate tgtIdx after splice
      tgtIdx=sites.findIndex(s=>s.id===tgtId);
      sites.splice(insertBefore?tgtIdx:tgtIdx+1,0,moved);
      render();
      saveSiteOrder();
      toast('Order saved');
    });
  });
}

let activeCtx=null;
function closeCtx(){if(activeCtx){activeCtx.remove();activeCtx=null;}}
document.addEventListener('click',closeCtx);

function showSiteMenu(siteId,e){
  closeCtx();
  const site=sites.find(s=>s.id===siteId);if(!site)return;
  const menu=document.createElement('div');menu.className='ctx';

  if(isReadOnly){
    // Viewer menu — add to own navigator
    const myFolderOpts=user
      ?`<div class="ctx-sub">${folders.length?'':''}</div>`
      :'';
    menu.innerHTML=`<div class="ctx-item" id="add-to-mine">➕ Add to my Navigator</div>`;
    document.body.appendChild(menu);activeCtx=menu;
    positionCtx(menu,e);
    menu.querySelector('#add-to-mine').addEventListener('click',()=>{closeCtx();showAddToMineModal(site);});
    return;
  }

  // Owner menu — submenu for Move To
  const subItems=folders.map(f=>`<div class="ctx-sub-item" data-move="${f.id}">📁 ${esc(f.name)}</div>`).join('');
  const moveItem=folders.length>0
    ?`<div class="ctx-item" id="move-item"><span style="display:flex;align-items:center;gap:10px">📁 Move to</span><span class="ctx-arrow">▶</span><div class="ctx-sub">${subItems}${site.folder_id?`<div class="ctx-sub-item" data-move-out="1">📤 Remove from category</div>`:''}</div></div>`
    :'';

  menu.innerHTML=`
    <div class="ctx-item" data-edit="${siteId}">✏️ Edit</div>
    ${moveItem}
    <div class="ctx-sep"></div>
    <div class="ctx-item danger" data-del="${siteId}">🗑️ Delete</div>`;
  document.body.appendChild(menu);activeCtx=menu;
  positionCtx(menu,e);

  menu.querySelector('[data-edit]')?.addEventListener('click',()=>{closeCtx();showEditModal(siteId);});
  menu.querySelectorAll('[data-move]').forEach(el=>el.addEventListener('click',()=>{updateSite(siteId,{folder_id:el.dataset.move});closeCtx();}));
  menu.querySelector('[data-move-out]')?.addEventListener('click',()=>{updateSite(siteId,{folder_id:null});closeCtx();});
  menu.querySelector('[data-del]')?.addEventListener('click',()=>{closeCtx();if(confirm('Remove this site?'))deleteSite(siteId);});
}

function positionCtx(menu,e){
  const r=e.target.getBoundingClientRect();
  let top=r.bottom+4,left=r.left;
  if(left+180>window.innerWidth)left=window.innerWidth-190;
  if(top+220>window.innerHeight)top=r.top-230;
  menu.style.top=top+'px';menu.style.left=left+'px';
  // flip submenu to left if too close to right edge
  const sub=menu.querySelector('.ctx-sub');
  if(sub){
    if(left+180+160>window.innerWidth){sub.style.left='auto';sub.style.right='100%';}
  }
}

      <div class="field"><label>Name <span style="color:var(--text-light);font-size:10px;text-transform:none">(optional)</span></label><input type="text" id="f-name" value="${esc(data.name||'')}" placeholder="e.g. ChatGPT"/></div>
      <div class="field"><label>Description <span style="color:var(--text-light);font-size:10px;text-transform:none">(optional)</span></label><textarea id="f-desc" placeholder="e.g. AI chatbot for writing and coding">${esc(data.description||'')}</textarea></div>
      <div class="field"><label>Category</label><select id="f-folder"><option value="">— None —</option>${folderOpts}</select><div class="hint"><a href="#" id="quick-cat" style="color:var(--accent)">+ Create new category</a></div></div>
    </div>
    <div class="modal-foot"><button class="btn" id="m-cancel">Cancel</button><button class="btn btn-primary" id="m-save">${isEdit?'Save Changes':'Add Site'}</button></div>
  `);
  if(!user)document.getElementById('warn-signin')?.addEventListener('click',e=>{e.preventDefault();closeModal();showAuthModal('signin');});
  const urlInput=document.getElementById('f-url');
  const preview=document.getElementById('fav-preview');
  function updatePreview(){const fav=faviconUrl(urlInput.value.trim());preview.innerHTML=fav?`<img src="${fav}" alt="" style="width:100%;height:100%;object-fit:contain" onerror="this.parentElement.innerHTML='<span style=font-size:22px>🌐</span>'"/>`:'<span style="font-size:22px">🌐</span>';}
  urlInput.addEventListener('input',updatePreview);if(data.url)updatePreview();
  document.getElementById('mc').onclick=closeModal;
  document.getElementById('m-cancel').onclick=closeModal;
  document.getElementById('quick-cat').onclick=async e=>{
    e.preventDefault();const name=prompt('New category name:');
    if(name?.trim()){
      if(!user){const f=guestAddFolder(name.trim());const sel=document.getElementById('f-folder');sel.innerHTML+=`<option value="${f.id}" selected>${esc(f.name)}</option>`;sel.value=f.id;return;}
      const{data:f,error}=await sb.from('folders').insert({user_id:user.id,name:name.trim(),order_index:folders.length}).select().single();
      if(!error){folders.push(f);const sel=document.getElementById('f-folder');sel.innerHTML+=`<option value="${f.id}" selected>${esc(f.name)}</option>`;sel.value=f.id;renderSidebar();}
    }
  };
  document.getElementById('m-save').onclick=async()=>{
    let url=document.getElementById('f-url').value.trim();
    if(!url){alert('URL is required');return;}
    if(!/^https?:\/\//i.test(url))url='https://'+url;
    const name=document.getElementById('f-name').value.trim();
    const description=document.getElementById('f-desc').value.trim();
    const folder_id=document.getElementById('f-folder').value||null;
    const btn=document.getElementById('m-save');btn.textContent='Saving…';btn.disabled=true;
    try{
      if(isEdit)await updateSite(data.id,{url,name,description,folder_id});
      else await saveSite({url,name,description,folder_id});
      closeModal();
    }catch(err){
      toast('Something went wrong');console.error(err);
      btn.textContent=isEdit?'Save Changes':'Add Site';btn.disabled=false;
    }
  };
  urlInput.focus();
}

// ── FOLDER MODALS ─────────────────────────────────────────────────────────
document.getElementById('add-folder-btn').onclick=()=>{
  openModal(`
    <div class="modal-head"><h3>New Category</h3><button class="btn btn-ghost btn-sm" id="mc">✕</button></div>
    <div class="modal-body">
      ${!user?`<div class="unsaved-warn"><span>⚠️</span><div>Not signed in — won't be saved. <a href="#" id="warn-signin" style="color:var(--accent)">Sign in first</a></div></div>`:''}
      <div class="field"><label>Name</label><input type="text" id="f-cat-name" placeholder="e.g. AI Tools, Shopping, Work…"/></div>
    </div>
    <div class="modal-foot"><button class="btn" id="m-cancel">Cancel</button><button class="btn btn-primary" id="m-save">Create</button></div>
  `);
  if(!user)document.getElementById('warn-signin')?.addEventListener('click',e=>{e.preventDefault();closeModal();showAuthModal('signin');});
  document.getElementById('mc').onclick=closeModal;
  document.getElementById('m-cancel').onclick=closeModal;
  document.getElementById('m-save').onclick=async()=>{const name=document.getElementById('f-cat-name').value.trim();if(!name)return;await saveFolder(name);closeModal();};
  document.getElementById('f-cat-name').focus();
};

function showRenameFolder(id){
  const f=folders.find(x=>x.id===id);
  openModal(`
    <div class="modal-head"><h3>Rename Category</h3><button class="btn btn-ghost btn-sm" id="mc">✕</button></div>
    <div class="modal-body"><div class="field"><label>Name</label><input type="text" id="f-cat-name" value="${esc(f.name)}"/></div></div>
    <div class="modal-foot"><button class="btn" id="m-cancel">Cancel</button><button class="btn btn-primary" id="m-save">Save</button></div>
  `);
  document.getElementById('mc').onclick=closeModal;
  document.getElementById('m-cancel').onclick=closeModal;
  document.getElementById('m-save').onclick=async()=>{const name=document.getElementById('f-cat-name').value.trim();if(!name)return;await updateFolder(id,name);closeModal();};
  document.getElementById('f-cat-name').select();
}

// ── SHARE MODAL ───────────────────────────────────────────────────────────
document.getElementById('share-btn').onclick=()=>{
  if(!user||isReadOnly)return;
  const baseUrl=`${window.location.origin}${window.location.pathname}`;

  openModal(`
    <div class="modal-head"><h3>Share</h3><button class="btn btn-ghost btn-sm" id="mc">✕</button></div>
    <div class="modal-body">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--bg);border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:16px">
        <span style="font-size:14px;font-weight:500">${isPublic?'🌍 Page is Public':'🔒 Page is Private'}</span>
        <button class="btn ${isPublic?'':'btn-primary'} btn-sm" id="toggle-public">${isPublic?'Make Private':'Make Public'}</button>
      </div>
      ${isPublic?`
      <div class="field">
        <label>What to share</label>
        <select id="share-scope">
          <option value="all" ${activeFolder==='all'?'selected':''}>🏠 All Sites (entire navigator)</option>
          ${folders.map(f=>`<option value="${f.id}" ${activeFolder===f.id?'selected':''}>📁 ${esc(f.name)}</option>`).join('')}
        </select>
      </div>
      <div class="share-url" id="share-link-url" style="font-size:12px;margin-top:4px"></div>
      <button class="btn btn-sm" style="margin-top:8px" id="copy-share-url">📋 Copy Link</button>
      `:'<p style="font-size:13px;color:var(--text-muted);margin-top:4px">Make your page public first to get a shareable link.</p>'}
    </div>
    <div class="modal-foot"><button class="btn" id="mc2">Close</button></div>
  `);

  document.getElementById('mc').onclick=closeModal;
  document.getElementById('mc2').onclick=closeModal;
  document.getElementById('toggle-public')?.addEventListener('click',async()=>{await togglePublic();closeModal();document.getElementById('share-btn').click();});

  function updateShareLink(){
    const scope=document.getElementById('share-scope')?.value;
    if(!scope)return;
    const url=scope==='all'?`${baseUrl}?user=${user.id}`:`${baseUrl}?user=${user.id}&folder=${scope}`;
    document.getElementById('share-link-url').textContent=url;
    document.getElementById('copy-share-url').onclick=()=>{navigator.clipboard.writeText(url);toast('Link copied!');};
  }
  document.getElementById('share-scope')?.addEventListener('change',updateShareLink);
  updateShareLink();
};

// ── AUTH MODAL ────────────────────────────────────────────────────────────
function showAuthModal(mode='signin'){
  const isSignin=mode==='signin';
  openModal(`
    <div class="modal-head" style="padding-bottom:18px">
      <div><div style="font-size:22px;font-weight:600;margin-bottom:4px">${isSignin?'Welcome back':'Create account'}</div>
      <div style="font-size:14px;color:var(--text-muted)">${isSignin?'Sign in to sync your navigator across all devices.':'Free account — your data is private and syncs everywhere.'}</div></div>
      <button class="btn btn-ghost btn-sm" id="mc" style="align-self:flex-start">✕</button>
    </div>
    <div class="modal-body" style="padding-top:0">
      <button class="social-btn github" id="gh-btn">
        <svg class="gh-ico" viewBox="0 0 24 24"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
        Continue with GitHub
      </button>
      <button class="social-btn google" id="gg-btn">
        <svg class="g-ico" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continue with Google
      </button>
      <div class="divider">or ${isSignin?'sign in':'sign up'} with email</div>
      <div class="auth-error" id="auth-err"></div>
      <div class="field"><label>Email</label><input type="email" id="a-email" placeholder="you@example.com" autocomplete="email"/></div>
      <div class="field"><label>Password</label><input type="password" id="a-pass" placeholder="${isSignin?'Your password':'At least 6 characters'}" autocomplete="${isSignin?'current-password':'new-password'}"/></div>
      ${!isSignin?`<div class="field"><label>Confirm Password</label><input type="password" id="a-pass2" placeholder="Repeat password" autocomplete="new-password"/></div>`:''}
      <button class="btn btn-primary" style="width:100%;justify-content:center;padding:11px" id="a-submit">${isSignin?'Sign in':'Create account'}</button>
      <div class="auth-toggle">${isSignin?`Don't have an account? <a id="a-switch">Sign up free</a>`:`Already have an account? <a id="a-switch">Sign in</a>`}</div>
    </div>
  `,'');
  document.getElementById('mc').onclick=closeModal;
  document.getElementById('gh-btn').onclick=()=>sb.auth.signInWithOAuth({provider:'github',options:{redirectTo:window.location.href}});
  document.getElementById('gg-btn').onclick=()=>sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.href}});
  document.getElementById('a-switch').onclick=()=>showAuthModal(isSignin?'signup':'signin');
  let submitting=false;
  document.getElementById('a-submit').onclick=async()=>{
    if(submitting)return;
    const email=document.getElementById('a-email').value.trim();
    const pass=document.getElementById('a-pass').value;
    const errEl=document.getElementById('auth-err');errEl.style.display='none';
    if(!email||!pass){showAuthError('Please fill in all fields.');return;}
    if(!isSignin){
      const pass2=document.getElementById('a-pass2').value;
      if(pass!==pass2){showAuthError('Passwords do not match.');return;}
      if(pass.length<6){showAuthError('Password must be at least 6 characters.');return;}
    }
    submitting=true;
    const btn=document.getElementById('a-submit');btn.textContent='Please wait…';btn.disabled=true;
    try{
      if(isSignin){
        const{error}=await sb.auth.signInWithPassword({email,password:pass});
        if(error){showAuthError(error.message);btn.textContent='Sign in';btn.disabled=false;submitting=false;}
      } else {
        const{data,error}=await sb.auth.signUp({email,password:pass});
        btn.textContent='Create account';btn.disabled=false;submitting=false;
        if(error){
          showAuthError(error.message);
        } else if(data?.user?.created_at){
          // If user was created within last 5 seconds → genuinely new
          const age=Date.now()-new Date(data.user.created_at).getTime();
          if(age<5000){
            showAuthError('✅ Confirmation email sent! Please check your inbox and confirm your email to sign in.',true);
          } else {
            showAuthError('This email is already registered. Please sign in instead.');
          }
        } else {
          showAuthError('✅ Confirmation email sent! Please check your inbox.<br/><span style="margin-top:6px;display:block">Already have an account? <a href="#" id="switch-to-signin" style="color:var(--accent)">Sign in instead</a></span>',true);
          setTimeout(()=>{document.getElementById('switch-to-signin')?.addEventListener('click',e=>{e.preventDefault();showAuthModal('signin');});},100);
        }
      }
    }catch(e){
      showAuthError('Error: '+e.message);
      btn.textContent=isSignin?'Sign in':'Create account';btn.disabled=false;submitting=false;
    }
  };
  document.getElementById('a-pass').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('a-submit').click();});
  document.getElementById('a-email').focus();
}
function showAuthError(msg,success=false){
  const el=document.getElementById('auth-err');if(!el)return;
  el.textContent=msg;el.style.display='block';
  if(success){el.style.background='#f0fdf4';el.style.borderColor='#86efac';el.style.color='#166534';}
  else{el.style.background='#fef2f2';el.style.borderColor='#fecaca';el.style.color='';}
}

// ── USER MENU ─────────────────────────────────────────────────────────────
let userMenu=null;
function showUserMenu(){
  if(userMenu){userMenu.remove();userMenu=null;return;}
  const meta=user.user_metadata||{};
  const menu=document.createElement('div');menu.className='user-menu';
  menu.innerHTML=`<div class="user-info"><div class="u-name">${esc(meta.full_name||meta.user_name||'')}</div><div class="u-email">${esc(user.email||'')}</div></div><div class="ctx-item danger" id="signout-btn">🚪 Sign out</div>`;
  document.body.appendChild(menu);userMenu=menu;
  const r=document.getElementById('auth-area').getBoundingClientRect();
  menu.style.top=(r.bottom+8)+'px';menu.style.right=(window.innerWidth-r.right)+'px';
  document.getElementById('signout-btn').onclick=()=>sb.auth.signOut();
}
document.addEventListener('click',()=>{if(userMenu){userMenu.remove();userMenu=null;}});

// ── MOBILE MENU ───────────────────────────────────────────────────────────
document.getElementById('menu-btn').onclick=e=>{
  e.stopPropagation();
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('open');
};
document.getElementById('sidebar-overlay').onclick=()=>{
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
};
// Close sidebar on folder select on mobile
function closeSidebarMobile(){
  if(window.innerWidth<=768){
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('open');
  }
}

// ── SEARCH & TOPBAR ───────────────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input',e=>{searchQuery=e.target.value;render();});
document.getElementById('add-site-btn').onclick=()=>showAddModal();

// ── MODAL HELPERS ─────────────────────────────────────────────────────────
function openModal(html,extraClass=''){
  const root=document.getElementById('modal-root');
  root.innerHTML=`<div class="overlay" id="overlay"><div class="modal ${extraClass}">${html}</div></div>`;
  root.querySelector('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});
}
function closeModal(){document.getElementById('modal-root').innerHTML='';}

init();
</script>
